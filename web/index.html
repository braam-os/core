<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>braam</title>
<style>
    html { color-scheme: dark; }
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #12131a;
        color: #c8cbd6;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #screen { flex: 1 1 auto; display: block; width: 100%; min-height: 0; }
    #status {
        flex: 0 0 auto;
        margin: 0;
        padding: 0.35rem 0.6rem;
        border-top: 1px solid #24263200;
        color: #6f7488;
        white-space: pre-wrap;
    }
    #status:not(:empty) { border-top-color: #242632; }
    .error { color: #e5687a; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<pre id="status"></pre>
<script type="module">
import { mount } from "./braam.js";

const status = document.getElementById("status");

function note(text, cls) {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = text;
    status.appendChild(line);
}

// Everything this page does is in braam.js now; what is left here is a canvas,
// a place to put diagnostics, and the one browser check that has to happen
// before anything is mounted. See embed.html for two of them on one page.
try {
    const term = mount({
        canvas: document.getElementById("screen"),
        onLog: (text) => console.log(text),
        onError: (text) => {
            console.error(text);
            note(text, "error");
        },
    });
    term.focus();
} catch (e) {
    note(e.message, "error");
}
</script>
</body>
</html>
