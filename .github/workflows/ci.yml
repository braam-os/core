name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Whole history: the version's third number is the commit count, and the
      # default shallow clone would build every revision as revision 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The distribution's clang, unversioned: llvm-ar and llvm-ranlib come from
      # llvm, wasm-ld from lld. Nothing else from any of them is used.
      - name: Install clang
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm

      - name: Toolchain versions
        run: clang++ --version | head -1; cmake --version | head -1; make --version | head -1; node --version

      # Same entry points a developer uses; the generator is Unix Makefiles,
      # so nothing beyond clang, cmake, make and node is needed. BRAAM_WERROR is
      # on by default and the toolchain file finds clang on PATH, so CI passes
      # no configure flags at all.
      - name: Build
        run: make

      - name: Test
        run: make run

      # The binaries are build/src/cmd/, one per file in src/cmd/. failglob so a
      # layout change is an error here rather than a literal pattern reaching
      # python. --report because a program has no budget: this is the number,
      # not a limit.
      - name: Report size
        run: |
          shopt -s failglob
          echo '### Binary size' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/size_budget.py --budgets tools/size_budget.txt --report \
            build/kernel.wasm build/rootfs build/web/rootfs.zip build/src/cmd/*.wasm \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: braam-web
          path: build/web/
