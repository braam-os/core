name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  WASI_SDK_VERSION: "33.0"
  WASI_SDK_DIR: /opt/wasi-sdk-33.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache wasi-sdk
        id: wasi-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WASI_SDK_DIR }}
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux

      - name: Install wasi-sdk
        if: steps.wasi-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tag="wasi-sdk-${WASI_SDK_VERSION%%.*}"
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/${tag}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL "$url" -o /tmp/wasi-sdk.tar.gz
          # The tarball unpacks to wasi-sdk-<version>-<arch>-<os>/, so strip
          # that level rather than depend on its name: WASI_SDK_DIR is what
          # the cache key, the toolchain default and a local install all use.
          sudo mkdir -p "$WASI_SDK_DIR"
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C "$WASI_SDK_DIR" --strip-components=1
          "$WASI_SDK_DIR/bin/clang++" --version

      - name: Toolchain versions
        run: cmake --version | head -1; make --version | head -1; node --version

      - name: Check formatting
        run: |
          "$WASI_SDK_DIR/bin/clang-format" --dry-run -Werror \
            $(find src test -name '*.cpp' -o -name '*.h')

      # Same entry points a developer uses; the generator is Unix Makefiles,
      # so nothing beyond cmake, make and node is needed.
      - name: Build
        run: make CMAKE_ARGS="-DBRAAM_LLVM=$WASI_SDK_DIR -DBRAAM_WERROR=ON"

      - name: Test
        run: make run

      - name: Report size
        run: |
          echo '### Binary size' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/size_budget.py --budgets tools/size_budget.txt build/kernel.wasm \
            build/src/bin/*.wasm >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: braam-web
          path: build/web/
